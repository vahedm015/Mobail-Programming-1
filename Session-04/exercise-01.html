<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile</title>
    <style>
        body {
            background-color: #f0f8ff;
            font-family: Tahoma, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: center;
            border: 2px solid #4682b4;
        }

        h1 {
            color: #2c3e50;
            font-size: 28px;
            margin-bottom: 20px;
        }

        p {
            font-size: 18px;
            color: #34495e;
            margin: 10px 0;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>پروفایل دانشجو</h1>
        <p><strong>نام دانشجو:</strong> مهدی واحد</p>
        <p><strong>رشته تحصیلی:</strong> مهندسی کامپیوتر</p>
        <p><strong>نام دانشگاه:</strong> دانشگاه محمد باقر</p>
    </div>

</body>
</html>
